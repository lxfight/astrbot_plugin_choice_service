name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish plugin release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.4,<9" "ruff==0.15.22"

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' metadata.yaml | head -n 1)"
          version="${version%\"}"
          version="${version#\"}"
          if [ -z "$version" ]; then
            echo "metadata.yaml does not declare a version" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match metadata version v${version}" >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: |
          ruff check --isolated --select E,F,I,UP,Q,W .
          ruff format --check --isolated .

      - name: Test
        run: pytest tests -q

      - name: Compile Python
        run: python -m compileall -q main.py decision_service.py i18n.py

      - name: Check page script
        run: node --check views/stats/app.js

      - name: Build plugin archive
        id: package
        shell: bash
        run: |
          mkdir -p dist
          archive="dist/astrbot_plugin_choice_service-v${{ steps.version.outputs.value }}.zip"
          git archive \
            --format=zip \
            --prefix="astrbot_plugin_choice_service/" \
            --output="$archive" \
            HEAD
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if section is None:
              raise SystemExit(f"Missing CHANGELOG.md section for {version}")
          notes = f"# Choice Service v{version}\n\n{section.group(1).strip()}\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Choice Service v${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: ${{ steps.package.outputs.archive }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
