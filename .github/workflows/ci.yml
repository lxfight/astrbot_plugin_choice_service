name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.4,<9" "ruff==0.15.22"

      - name: Lint
        run: |
          ruff check --isolated --select E,F,I,UP,Q,W .
          ruff format --check --isolated .

      - name: Test
        run: pytest tests -q

      - name: Compile Python
        run: python -m compileall -q .

      - name: Check page script
        run: node --check views/stats/app.js
